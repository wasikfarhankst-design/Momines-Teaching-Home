<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momin's Teaching Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            text-align: center;
            margin: 0;
        }

        header {
            background: #0756a3;
            color: white;
            padding: 30px 10px;
        }

        main {
            padding: 30px 15px;
        }

        .card {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            background: #0756a3;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h1>Momin's Teaching Home</h1>
        <p>শিক্ষাই শক্তি, শিক্ষাই আলো 📚</p>
    </header>

    <main>
        <div class="card">
            <h2>স্বাগতম!</h2>
            <p>আমাদের শিক্ষাপ্রতিষ্ঠানের ওয়েবসাইটে তোমাকে স্বাগতম।</p>

            <button onclick="alert('স্বাগতম! 😊')">
                এখানে ক্লিক করো
            </button>
        </div>
    </main>
</body>
</html>
